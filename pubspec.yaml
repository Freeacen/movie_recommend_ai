name: movie_recommend_ai
description: "Cross-platform Flutter movie tracking and AI-powered personalized recommendation application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Local SQLite Persistence
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & APIs
  http: ^1.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

  # Design & Icons
  cupertino_icons: ^1.0.6
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.25.2

flutter:
  uses-material-design: true
